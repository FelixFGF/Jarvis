name: Publish Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Build the self-contained installer
        shell: pwsh
        run: ./Installer/Build-Installer.ps1 -Configuration Beta -OutputDirectory Installer/artifacts -Version '${{ steps.release.outputs.version }}'

      - name: Build signed x64 update package
        id: signed_update
        continue-on-error: true
        shell: pwsh
        env:
          JARVIS_UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.JARVIS_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          $tagVersion = '${{ steps.release.outputs.version }}'
          ./Installer/Build-UpdatePackage.ps1 -Configuration Beta -OutputDirectory Installer/artifacts -Version $tagVersion

      - name: Publish installer as the GitHub release download
        uses: softprops/action-gh-release@v2
        with:
          name: Jarvis ${{ steps.release.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            Installer/artifacts/Jarvis-Setup.exe
            Installer/artifacts/Jarvis-Setup.exe.sha256

      - name: Publish authenticated update assets
        if: steps.signed_update.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            Installer/artifacts/Jarvis-Update-win-x64.zip
            Installer/artifacts/Jarvis-Update-win-x64.json
            Installer/artifacts/Jarvis-Update-win-x64.sig

      - name: Report unavailable authenticated update package
        if: steps.signed_update.outcome != 'success'
        shell: pwsh
        run: Write-Warning 'The installer was published, but authenticated update assets were omitted because the signing key could not create a valid package.'
